# 管理端 m.kych.net：纯静态 SPA。
# 产物由 GitHub Actions 发布到 /opt/kych-admin（见 .github/workflows/deploy-admin.yml）。
# 所有交互都在浏览器端执行，接口打到主域 https://kych.net，本机不代理任何 API。
#
# 证书策略：复用主域 kych.net 那张（SAN 覆盖 kych.net/api/origin/www）。
# EdgeOne 回源时把 SNI 固定为 kych.net、Host 保持 m.kych.net：
# nginx 用 SNI 选证书、用 Host 选 vhost，两者可以分开，因此不必为 m 单独签证书。
# 直接拿浏览器访问 https://m.kych.net（不经 EO）会因 SNI 无匹配落到 default_server，
# 拿到 kych.net 证书而报名称不匹配——这是预期行为，正常流量都经由 EO。

server {
    listen 80;
    listen [::]:80;
    server_name m.kych.net;

    # Let's Encrypt HTTP-01 验证（certbot webroot）。当前用不到，留作后续扩展证书。
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /opt/kych-admin;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.kych.net;

    # 与主域共用证书，理由见文件头。
    ssl_certificate     /etc/letsencrypt/live/kych.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kych.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/kych-admin;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # 带内容 hash 的产物：长缓存。
    # 只用 add_header，不用 expires——两者叠加会产出两条 Cache-Control，
    # CDN 取哪条不确定，反而容易缓存错。
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 入口文件：每次回源校验，发版后刷新即拿到新版。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
