# kych.net：内容站 + 管理端 + 编辑器 + 后端接口统一入口。
#
#   /             → /opt/kych-net/dist   （内容站，后端 build 产出）
#   /管理/        → /opt/kych-admin      （管理端 SPA）
#   /编辑器/      → /opt/kych-editor     （独立移动优先编辑器 SPA）
#   /api/ /git/ /mcp /oauth/ /.well-known/oauth-*
#                 → 127.0.0.1:8080      （后端 kych-net serve）
#
# EdgeOne 只做加速回源，回源 HOST/SNI 均为 kych.net，复用主域证书。
# www.kych.net 直连源站，仅 301 到主域；eo.kych.net 为历史入口，同样只 301。
#
# 注意：nginx 的 add_header 按「就近整组覆盖」继承——location 里只要出现
# 一条 add_header，server 级的全部 add_header 都不再生效。因此每个带
# add_header 的 location 都必须重复完整的安全头组，不能只写缓存头。

# 80 端口兜底：未知 Host 直接断开连接，不返回任何内容。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 80 端口只服务 Let's Encrypt 验证，其余一律跳 HTTPS。
# 不能直接不监听 80：现有证书走 webroot 续期，certbot.timer 每天要访问
# /.well-known/acme-challenge/，关掉端口会让自动续期失效、证书到期后整站挂掉。
server {
    listen 80;
    listen [::]:80;
    server_name kych.net www.kych.net eo.kych.net;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://kych.net$request_uri; }
}

# www 与历史入口 eo：直连源站的请求一律 301 到主域。
# 证书是主域那张；若未包含 www，浏览器会先报证书名不匹配，属预期
# （www 的正常流量应走 DNS 层跳转或直连 http）。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kych.net eo.kych.net;

    ssl_certificate     /etc/letsencrypt/live/kych.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kych.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kych.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kych.net;

    ssl_certificate     /etc/letsencrypt/live/kych.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kych.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/kych-net/dist;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # ---------- 后端接口 ----------
    # 公共代理参数在各 location 内重复声明（nginx 的 proxy_set_header 同样
    # 按就近整组覆盖继承）。后端按 Host 判定 kych.net，必须透传 $host。
    # 前缀 location 一律带 ^~：否则以 .js/.svg/.png 等结尾的 URI（如分支名
    # fix/logo.svg 对应的 /api/projects/{id}/branches/...）会被内容站的
    # 静态正则 location 抢走返回 404。

    # JSON API：后端全局请求体上限 2 MiB（头像更小，由后端自行限制）。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        client_max_body_size 2m;
        proxy_read_timeout 120s;
    }

    # Git smart HTTP + LFS：pack 上传/下载都是大体积流式传输，
    # 关掉两侧缓冲，请求体上限与后端一致（256 MiB）。
    location ^~ /git/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # MCP Streamable HTTP：可能挂长连接 SSE，关缓冲、放宽读超时。
    location ^~ /mcp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        client_max_body_size 2m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP OAuth 授权服务器（注册/授权/令牌）。
    location ^~ /oauth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        client_max_body_size 2m;
    }

    # OAuth 元数据发现（protected-resource 与 authorization-server 两组）。
    # ^~ 保证不被内容站的静态正则 location 抢走；ACME 验证走上面的 80 端口。
    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ---------- 管理端 ----------
    # ^~ 必须加：否则 /管理/assets/x.js 会被下面的 .js 正则 location 抢走，
    # 那句的 root 是内容站，管理端的 chunk 全部 404。
    location = /管理 { return 301 /管理/; }

    location ^~ /管理/assets/ {
        alias /opt/kych-admin/assets/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location ^~ /管理/ {
        alias /opt/kych-admin/;
        # 管理端是 SPA：入口 html 用 60 秒短缓存，assets 走上面的 immutable
        # 长缓存。部署时保留旧 chunk，避免缓存中的旧 index 引用已删除的 JS。
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=30" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /管理/index.html;
    }

    # ---------- 独立编辑器 ----------
    # 与管理端同构：^~ 防止 /编辑器/assets/*.js 被内容站的 .js 正则 location 抢走。
    # 深链接（?page=id / ?project=id）由 index.html 兜底；assets 带 hash 长缓存，入口 no-cache。
    location = /编辑器 { return 301 /编辑器/; }

    location ^~ /编辑器/assets/ {
        alias /opt/kych-editor/assets/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location ^~ /编辑器/ {
        alias /opt/kych-editor/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /编辑器/index.html;
    }

    # ---------- 内容站 ----------
    # 根路径：try_files 的 $uri 会匹配到目录，ingress 的 index 内部重定向
    # 不一定触发 location = /index.html，这里显式兜住。
    # 内容站 HTML 交给 CDN 短缓存：5 分钟内复用边缘副本。
    location = / {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60, stale-if-error=600" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|woff2?|svg|ico|png|jpe?g|webp)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60, stale-if-error=600" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
