# eo.kych.net：内容站 + 管理端统一入口。
#
#   /         → /opt/kych-net/dist   （内容站，原 c.kych.net）
#   /管理/    → /opt/kych-admin      （管理端 SPA，原 m.kych.net）
#   /编辑器/  → /opt/kych-editor     （独立移动优先编辑器 SPA）
#
# 证书：复用主域 kych.net 那张。EdgeOne 回源 SNI 固定为 kych.net、Host 保持
# eo.kych.net，nginx 按 SNI 选证书、按 Host 选 vhost，因此无需为 eo 单独签发。
# 直接以 https://eo.kych.net 访问源站（绕过 EO）会因 SNI 无匹配落到
# default_server 而报证书名不匹配，属预期。

# 80 端口兜底：未知 Host 直接断开连接，不返回任何内容。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 80 端口只服务 Let's Encrypt 验证，其余一律跳 HTTPS。
# 不能直接不监听 80：现有证书走 webroot 续期，certbot.timer 每天要访问
# /.well-known/acme-challenge/，关掉端口会让自动续期失效、证书到期后整站挂掉。
server {
    listen 80;
    listen [::]:80;
    server_name eo.kych.net;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://eo.kych.net$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eo.kych.net;

    ssl_certificate     /etc/letsencrypt/live/kych.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kych.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/kych-net/dist;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # ---------- 管理端 ----------
    # ^~ 必须加：否则 /管理/assets/x.js 会被下面的 .js 正则 location 抢走，
    # 那句的 root 是内容站，管理端的 chunk 全部 404。
    location = /管理 { return 301 /管理/; }

    location ^~ /管理/assets/ {
        alias /opt/kych-admin/assets/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ^~ /管理/ {
        alias /opt/kych-admin/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /管理/index.html;
    }

    # ---------- 独立编辑器 ----------
    # 与管理端同构：^~ 防止 /编辑器/assets/*.js 被内容站的 .js 正则 location 抢走。
    # 深链接（?page=id）由 index.html 兜底；assets 带 hash 长缓存，入口 no-cache。
    location = /编辑器 { return 301 /编辑器/; }

    location ^~ /编辑器/assets/ {
        alias /opt/kych-editor/assets/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ^~ /编辑器/ {
        alias /opt/kych-editor/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /编辑器/index.html;
    }

    # ---------- 内容站 ----------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|woff2?|svg|ico|png|jpe?g|webp)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

