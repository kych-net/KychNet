[package]
name = "kych-net"
version = "0.3.0"
edition = "2021"
description = "KychNet personal site backend"
license = "AGPL-3.0-only"

[features]
# 交叉编译 musl 静态二进制时启用,让 openssl 随源码编译而不是依赖系统库.
vendored-openssl = ["dep:openssl", "openssl/vendored"]

[dependencies]
anyhow = "1"
askama = "0.12"
axum = "0.8"
base32 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
flate2 = "1"
ftml = "1"
hex = "0.4"
openssl = { version = "0.10", optional = true }
pulldown-cmark = "0.12"
rand = "0.8"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "0.15", default-features = false, features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typst = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
typst-html = "0.13"
typst-pdf = "0.13"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

[profile.release]
lto = true
codegen-units = 1
