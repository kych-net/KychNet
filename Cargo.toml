[package]
name = "kych-net"
version = "0.3.0"
edition = "2021"
description = "KychNet personal site backend"
license = "AGPL-3.0-only"

[features]
# 交叉编译 musl 静态二进制时启用,让 openssl 随源码编译而不是依赖系统库.
vendored-openssl = ["dep:openssl", "openssl/vendored"]

[dependencies]
anyhow = "1"
askama = "0.12"
axum = "0.8"
# 仅用于把 Git pack 分块写进响应体（Body::from_stream）。
# axum 自身已依赖 futures-util，这里只是显式声明。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base32 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
flate2 = "1"
tar = "0.4"
# 资源监控：statvfs 读磁盘用量（锁文件里已有传递依赖，不增加下载）。
libc = "0.2"
ureq = "2"
ftml = "1"
hex = "0.4"
openssl = { version = "0.10", optional = true }
pulldown-cmark = "0.12"
# Git over SSH：内建 SSH 服务端。russh 0.65 锁定 ssh-key 0.7.0-rc.11，
# 这里必须用同一版本，否则会出现两份不兼容的 PublicKey 类型。
# crypto 后端用 ring（纯 Rust 构建），避免 aws-lc-rs 的 CMake 依赖。
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
ssh-key = "=0.7.0-rc.11"
# 仅供 SSH 主机密钥生成使用；russh 0.65 依赖 rand 0.10，与项目本身的 rand 0.8 并存。
russh-rand = { package = "rand", version = "0.10", features = ["thread_rng"] }
# MCP（Model Context Protocol）官方 Rust SDK：/mcp 只读内容接口
rmcp = { version = "3.9", features = ["transport-streamable-http-server"] }
schemars = "1"
rand = "0.8"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "0.15", default-features = false, features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typst = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-html = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
