<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site.site_name }}{% endblock %}</title>
    {% if !site.description.is_empty() %}
    <meta name="description" content="{{ site.description }}" />
    <meta property="og:description" content="{{ site.description }}" />
    {% endif %}
    <meta property="og:site_name" content="{{ site.site_name }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/fonts/lxgw-wenkai-screen/lxgwwenkaiscreen.css" />
    {% for href in styles %}
    <link rel="stylesheet" href="{{ href }}" />
    {% endfor %}
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --text: #1a1a1a;
        --muted: #666666;
        --border: #e5e5e0;
        --accent: #2563eb;
      }
      [data-theme="dark"] {
        --bg: #0f1115;
        --panel: #161a20;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #262b33;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.75;
      }
      .topbar {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 1.5rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; color: var(--text); text-decoration: none; }
      .brand img { height: 2rem; width: auto; }
      .brand-mark {
        width: 2rem; height: 2rem; border-radius: 8px;
        display: grid; place-items: center;
        background: var(--accent); color: #fff;
        font-weight: 700; font-size: 0.9rem;
      }
      .dir-tree-toggle {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        padding: 0.3rem 0.7rem;
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .dir-tree-panel {
        position: absolute;
        top: 100%;
        left: 1.5rem;
        z-index: 20;
        width: min(24rem, calc(100vw - 3rem));
        max-height: 70vh;
        overflow: auto;
        padding: 0.9rem 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0 0 10px 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      }
      .dir-tree-title { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.4rem; }
      .dir-tree, .dir-children { list-style: none; margin: 0; padding-left: 0.9rem; }
      .dir-tree { padding-left: 0; }
      .dir-tree li { margin: 0.15rem 0; }
      .dir-toggle {
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0.1rem 0;
      }
      .dir-toggle::before { content: "▸ "; color: var(--muted); }
      .dir-toggle[aria-expanded="true"]::before { content: "▾ "; }
      .dir-tree .file a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .dir-tree .file a:hover { color: var(--accent); }
      .dir-tree .file a::before { content: "· "; color: var(--border); }
      .nav { display: flex; gap: 1.25rem; flex: 1; justify-content: center; }
      .nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
      .nav a:hover { color: var(--text); }
      .actions { display: flex; align-items: center; gap: 0.75rem; }
      .actions button, .actions .btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        padding: 0.3rem 0.7rem;
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        text-decoration: none;
      }
      main {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem;
        font-family: "LXGW WenKai Screen", "LXGW WenKai", "Kaiti SC", "STKaiti", serif;
      }
      .page-title { font-size: 1.6rem; margin: 0 0 1.5rem; }
      .post-list { list-style: none; padding: 0; margin: 0; }
      .post-list li {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: 0.9rem 0; border-bottom: 1px solid var(--border);
      }
      .post-list a { color: var(--text); text-decoration: none; font-weight: 500; }
      .post-list a:hover { color: var(--accent); }
      .post-list time { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
      .post h1, .content h1 { font-size: 1.8rem; line-height: 1.3; margin: 0 0 0.6rem; }
      .content h1:first-child { margin-top: 0; }
      .post-meta { display: flex; gap: 1rem; color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
      .pdf-download { margin: 2rem 0 0; font-size: 0.9rem; }
      .pdf-download a { color: var(--accent); }
      .post-meta a { color: var(--accent); }
      .content img { max-width: 100%; }
      .content table { border-collapse: collapse; }
      .content pre { overflow-x: auto; padding: 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
      .wj-code-copy { display: inline-flex; align-items: center; gap: .3rem; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; }
      .wj-code-copy:hover { color: var(--text); }
      .wj-code-copy .wj-sprite { width: 1rem; height: 1rem; }
      .wj-code-copy.copied { color: #16a34a; }
      footer { display: none; }

      @media (max-width: 640px) {
        .topbar {
          flex-wrap: wrap;
          gap: 0.5rem 0.75rem;
          padding: 0.55rem 0.8rem;
        }
        .brand img { height: 1.8rem; }
        .brand-mark { width: 1.8rem; height: 1.8rem; }
        .nav {
          order: 5;
          flex: 1 0 100%;
          justify-content: flex-start;
          gap: 1rem;
          overflow-x: auto;
          padding-bottom: 0.1rem;
          scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav a { white-space: nowrap; font-size: 0.9rem; }
        .actions { margin-left: auto; gap: 0.45rem; }
        .actions button, .actions .btn {
          padding: 0.4rem 0.6rem;
          font-size: 0.85rem;
        }
        .dir-tree-toggle { padding: 0.4rem 0.65rem; }
        .dir-tree-panel {
          left: 0.8rem;
          width: calc(100vw - 1.6rem);
          max-height: calc(100vh - 8rem);
        }
        main {
          padding: 1.5rem 0.85rem 3rem;
        }
        .page-title { font-size: 1.35rem; }
        .post h1 { font-size: 1.45rem; }
        .post-meta {
          flex-wrap: wrap;
          gap: 0.35rem 1rem;
          margin-bottom: 1.25rem;
        }
        .post-list li {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.1rem;
        }
        .post-list time { white-space: normal; }
        .content { overflow-wrap: anywhere; }
        .content img { height: auto; }
        .content table {
          display: block;
          max-width: 100%;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
        .content pre {
          padding: 0.75rem;
          font-size: 0.8rem;
        }
      }

      @media (max-width: 380px) {
        .actions .btn { padding: 0.4rem 0.45rem; }
        .dir-tree-toggle { padding: 0.4rem 0.5rem; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        {% if site.logo_url.is_empty() %}
        <span class="brand-mark">{{ site.site_name }}</span>
        {% else %}
        <img src="{{ site.logo_url }}" alt="{{ site.site_name }}" />
        {% endif %}
      </a>
      <button id="dir-tree-toggle" class="dir-tree-toggle" type="button" aria-expanded="false" aria-controls="dir-tree-panel">目录</button>
      <nav class="nav">
        {% for link in site.nav %}
        <a href="{{ link.href }}">{{ link.label }}</a>
        {% endfor %}
      </nav>
      <div class="actions">
        <button id="theme-toggle" type="button" aria-label="切换主题">主题</button>
        <a class="btn" href="{{ admin_url }}">管理端</a>
      </div>
      <div id="dir-tree-panel" class="dir-tree-panel" hidden>
        <div class="dir-tree-title">目录</div>
        {{ tree|safe }}
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script>
      (function () {
        var root = document.documentElement;
        var saved = localStorage.getItem("kych-net-theme");
        var initial = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        root.setAttribute("data-theme", initial);
        document.getElementById("theme-toggle").addEventListener("click", function () {
          var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          localStorage.setItem("kych-net-theme", next);
        });
      })();
    </script>
    <script>
      (function () {
        document.addEventListener("click", function (event) {
          var button = event.target.closest && event.target.closest("wj-code-copy");
          if (!button) return;
          var code = button.closest("wj-code");
          var source = code && code.querySelector("pre code");
          if (!source || !navigator.clipboard) return;
          navigator.clipboard.writeText(source.innerText).then(function () {
            button.classList.add("copied");
            setTimeout(function () { button.classList.remove("copied"); }, 1200);
          }).catch(function () {});
        });
      })();
    </script>
    <script>
      (function () {
        var toggle = document.getElementById("dir-tree-toggle");
        var panel = document.getElementById("dir-tree-panel");
        if (!toggle || !panel) return;
        toggle.addEventListener("click", function () {
          var open = panel.hidden;
          panel.hidden = !open;
          toggle.setAttribute("aria-expanded", String(open));
        });
        panel.addEventListener("click", function (event) {
          var button = event.target.closest(".dir-toggle");
          if (!button) return;
          var children = button.parentElement.querySelector(".dir-children");
          if (!children) return;
          var open = children.hidden;
          children.hidden = !open;
          button.setAttribute("aria-expanded", String(open));
        });
      })();
    </script>
  </body>
</html>
