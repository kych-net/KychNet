<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site.site_name }}{% endblock %}</title>
    {% for href in styles %}
    <link rel="stylesheet" href="{{ href }}" />
    {% endfor %}
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --text: #1a1a1a;
        --muted: #666666;
        --border: #e5e5e0;
        --accent: #2563eb;
      }
      [data-theme="dark"] {
        --bg: #0f1115;
        --panel: #161a20;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #262b33;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.75;
      }
      .topbar {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 1.5rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; color: var(--text); text-decoration: none; }
      .brand img { height: 2rem; width: auto; }
      .brand-mark {
        width: 2rem; height: 2rem; border-radius: 8px;
        display: grid; place-items: center;
        background: var(--accent); color: #fff;
        font-weight: 700; font-size: 0.9rem;
      }
      .dir-tree-toggle {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        padding: 0.3rem 0.7rem;
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .dir-tree-panel {
        position: absolute;
        top: 100%;
        left: 1.5rem;
        z-index: 20;
        width: min(24rem, calc(100vw - 3rem));
        max-height: 70vh;
        overflow: auto;
        padding: 0.9rem 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0 0 10px 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      }
      .dir-tree-title { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.4rem; }
      .dir-tree, .dir-children { list-style: none; margin: 0; padding-left: 0.9rem; }
      .dir-tree { padding-left: 0; }
      .dir-tree li { margin: 0.15rem 0; }
      .dir-toggle {
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0.1rem 0;
      }
      .dir-toggle::before { content: "▸ "; color: var(--muted); }
      .dir-toggle[aria-expanded="true"]::before { content: "▾ "; }
      .dir-tree .file a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .dir-tree .file a:hover { color: var(--accent); }
      .dir-tree .file a::before { content: "· "; color: var(--border); }
      .nav { display: flex; gap: 1.25rem; flex: 1; justify-content: center; }
      .nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
      .nav a:hover { color: var(--text); }
      .actions { display: flex; align-items: center; gap: 0.75rem; }
      .actions button, .actions .btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        padding: 0.3rem 0.7rem;
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        text-decoration: none;
      }
      main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
      .page-title { font-size: 1.6rem; margin: 0 0 1.5rem; }
      .post-list { list-style: none; padding: 0; margin: 0; }
      .post-list li {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: 0.9rem 0; border-bottom: 1px solid var(--border);
      }
      .post-list a { color: var(--text); text-decoration: none; font-weight: 500; }
      .post-list a:hover { color: var(--accent); }
      .post-list time { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
      .post h1 { font-size: 1.8rem; line-height: 1.3; margin: 0 0 0.5rem; }
      .post-meta { display: flex; gap: 1rem; color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
      .post-meta a { color: var(--accent); }
      .content img { max-width: 100%; }
      .content table { border-collapse: collapse; }
      .content pre { overflow-x: auto; padding: 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
      footer { display: none; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        {% if site.logo_url.is_empty() %}
        <span class="brand-mark">{{ site.site_name }}</span>
        {% else %}
        <img src="{{ site.logo_url }}" alt="{{ site.site_name }}" />
        {% endif %}
      </a>
      <button id="dir-tree-toggle" class="dir-tree-toggle" type="button" aria-expanded="false" aria-controls="dir-tree-panel">目录</button>
      <nav class="nav">
        {% for link in site.nav %}
        <a href="{{ link.href }}">{{ link.label }}</a>
        {% endfor %}
      </nav>
      <div class="actions">
        <button id="theme-toggle" type="button" aria-label="切换主题">主题</button>
        <a class="btn" href="{{ admin_url }}">管理端</a>
      </div>
      <div id="dir-tree-panel" class="dir-tree-panel" hidden>
        <div class="dir-tree-title">目录</div>
        {{ tree|safe }}
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script>
      (function () {
        var root = document.documentElement;
        var saved = localStorage.getItem("kych-net-theme");
        var initial = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        root.setAttribute("data-theme", initial);
        document.getElementById("theme-toggle").addEventListener("click", function () {
          var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          localStorage.setItem("kych-net-theme", next);
        });
      })();
    </script>
    <script>
      (function () {
        var toggle = document.getElementById("dir-tree-toggle");
        var panel = document.getElementById("dir-tree-panel");
        if (!toggle || !panel) return;
        toggle.addEventListener("click", function () {
          var open = panel.hidden;
          panel.hidden = !open;
          toggle.setAttribute("aria-expanded", String(open));
        });
        panel.addEventListener("click", function (event) {
          var button = event.target.closest(".dir-toggle");
          if (!button) return;
          var children = button.parentElement.querySelector(".dir-children");
          if (!children) return;
          var open = children.hidden;
          children.hidden = !open;
          button.setAttribute("aria-expanded", String(open));
        });
      })();
    </script>
  </body>
</html>
