{% extends "layout.html" %}

{% block title %}{{ title }} · {{ site.site_name }}{% endblock %}

{% block content %}
<article class="post">
  <h1>{{ title }}</h1>
  <div class="post-meta">
    <time>{{ date }}</time>
    {% if !pdf_url.is_empty() %}
    <a href="{{ pdf_url }}">下载 PDF</a>
    {% endif %}
  </div>
  <div class="content">{{ content|safe }}</div>
</article>
{% endblock %}
