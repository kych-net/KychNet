{% extends "layout.html" %}

{% block title %}{{ title }} · {{ site.site_name }}{% endblock %}

{% block content %}
<article class="post">
  <div class="content">{{ content|safe }}</div>
  {% if !pdf_url.is_empty() %}
  <p class="pdf-download"><a href="{{ pdf_url }}">下载 PDF</a></p>
  {% endif %}
</article>
{% endblock %}
