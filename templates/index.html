{% extends "layout.html" %}

{% block title %}{{ site.site_name }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ site.site_name }}</h1>
<ul class="post-list">
  {% for post in posts %}
  <li>
    <a href="{{ post.href }}">{{ post.title }}</a>
    <time>{{ post.date }}</time>
  </li>
  {% endfor %}
</ul>
{% endblock %}
