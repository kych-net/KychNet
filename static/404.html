<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>404 · 页面不存在</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #e5e5e0;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --panel: #161a20;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #262b33;
        --accent: #6ea8fe;
      }
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main { max-width: 34rem; padding: 2rem; text-align: center; }
    h1 { font-size: 3rem; margin: 0 0 1rem; }
    p { color: var(--muted); line-height: 1.8; margin: 0 0 1.5rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    a {
      display: inline-block;
      padding: .6rem 1rem;
      border-radius: .4rem;
      text-decoration: none;
      font-size: .95rem;
    }
    a.primary { background: var(--accent); color: #fff; }
    a.ghost { border: 1px solid var(--border); color: var(--text); background: var(--panel); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>这个页面不存在，可能已经被移动或删除。</p>
    <div class="actions">
      <a class="primary" href="/">返回首页</a>
      <a class="ghost" href="/项目/">浏览项目</a>
    </div>
  </main>
</body>
</html>
