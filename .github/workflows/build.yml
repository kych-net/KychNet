name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            features: ""
            run_tests: true
          - target: x86_64-unknown-linux-musl
            features: "--features vendored-openssl"
            run_tests: false
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.run_tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kych-net dist/kych-net
          cp .env.example dist/.env.example
          tar -czf kych-net-${{ matrix.target }}.tar.gz -C dist .
          sha256sum kych-net-${{ matrix.target }}.tar.gz > SHA256SUMS-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: kych-net-${{ matrix.target }}
          path: |
            kych-net-${{ matrix.target }}.tar.gz
            SHA256SUMS-${{ matrix.target }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kych-net-${{ matrix.target }}.tar.gz
            SHA256SUMS-${{ matrix.target }}
